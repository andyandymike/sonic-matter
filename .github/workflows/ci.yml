name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-a:
    name: Gate A
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject private files
        shell: bash
        run: |
          leaked_files="$(git ls-files 'spec/**' 'planning-private/**' '.local/**')"
          if [[ -n "$leaked_files" ]]; then
            printf '%s\n' "Private files are tracked:" "$leaked_files"
            exit 1
          fi

      - name: Install Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false

      - name: Report engine version
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run internal weighted-choice tests
        run: godot --headless --path . --script res://tests/runtime_v2/weighted_choice_microkernel_runner.gd

      - name: Observe legacy replay portability (non-support signal)
        continue-on-error: true
        run: godot --headless --path . --script res://tests/runtime_v2/gate_a_policy_compat_runner.gd

      - name: Run exact package inventory negative tests
        run: python -X utf8 -m unittest discover -s tests/runtime_v2 -p 'test_*.py' -v

      - name: Run Gate A tests
        run: godot --headless --path . --script res://tests/gate_a/test_runner.gd

      - name: Run instrumented scene smoke
        run: godot --headless --path . --script res://tests/gate_a/scene_smoke_runner.gd
      - name: Run lifecycle and burst smoke
        run: godot --headless --path . --script res://tests/gate_a/lifecycle_smoke_runner.gd
      - name: Run generated-audio safety gate
        run: godot --headless --path . --script res://tests/gate_a/audio_safety_runner.gd

      - name: Record main-thread submission probe
        run: godot --headless --path . --script res://tests/gate_a/submission_probe.gd

      - name: Audit and build deterministic RC1 packages
        run: python -X utf8 tools/package_rc0.py --kind all

  material-lab:
    name: Material Lab (offline authoring)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject private and quarantine files
        shell: bash
        run: |
          leaked_files="$(git ls-files 'spec/**' 'planning-private/**' '.local/**')"
          if [[ -n "$leaked_files" ]]; then
            printf '%s\n' "Private or quarantine files are tracked:" "$leaked_files"
            exit 1
          fi

      - name: Report Python version
        run: python --version

      - name: Install authoring-only dependency
        run: python -m pip install --disable-pip-version-check -r requirements-material-lab.txt

      - name: Run Material Lab tests
        run: python -X utf8 -m unittest discover -s tests/material_lab -v
      - name: Install Godot for compiled-resource smoke
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: false

      - name: Build deterministic Godot compiler fixture
        run: python -X utf8 -m tests.material_lab.build_godot_compiler_fixture

      - name: Import generated compiler fixture
        run: godot --headless --editor --path . --quit

      - name: Run Godot compiler resource smoke
        run: godot --headless --path . --script res://tests/material_lab/godot_compiler_runner.gd


      - name: Run UI Foley offline tests
        run: python -X utf8 -m unittest discover -s tests/ui_foley -v

      - name: Smoke CLI boundary
        run: python -X utf8 -m tools.material_lab --help

  content-packs:
    name: Content packs (rights and integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit optional content packs
        run: python -X utf8 -m unittest discover -s tests/content_packs -v

  windows-export:
    name: Windows export and package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject private files
        shell: pwsh
        run: |
          $leaked = git ls-files 'spec/**' 'planning-private/**' '.local/**'
          if ($leaked) {
            Write-Error "Private files are tracked:"
            $leaked
            exit 1
          }

      - name: Install Material Lab authoring dependency
        run: python -m pip install --disable-pip-version-check -r requirements-material-lab.txt

      - name: Replay authoring bridge determinism on Windows
        run: python -X utf8 -m unittest tests.material_lab.test_authoring_bridge -v

      - name: Install Godot with export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: pwsh
        run: |
          & tools/invoke_godot_windows.ps1 `
            -GodotArguments @("--headless", "--editor", "--path", ".", "--quit")

      - name: Run Windows Gate A tests
        shell: pwsh
        run: |
          $runnerMatrix = @(
            @{ Script = "res://tests/runtime_v2/gate_a_policy_compat_runner.gd"; Sentinel = "RUNTIME_V2_COMPAT_OK" },
            @{ Script = "res://tests/runtime_v2/weighted_choice_microkernel_runner.gd"; Sentinel = "RUNTIME_V2_MICROKERNEL_OK" },
            @{ Script = "res://tests/runtime_v2/export_inventory_validator_runner.gd"; Sentinel = "RUNTIME_V2_EXPORT_INVENTORY_VALIDATOR_OK" },
            @{ Script = "res://tests/runtime_v2/policy_benchmark_runner.gd"; Sentinel = "RUNTIME_V2_POLICY_BENCHMARK_OK" },
            @{ Script = "res://tests/gate_a/test_runner.gd"; Sentinel = "GATE_A_TESTS_OK" },
            @{ Script = "res://tests/gate_a/scene_smoke_runner.gd"; Sentinel = "GATE_A_SCENE_SMOKE_OK" },
            @{ Script = "res://tests/gate_a/lifecycle_smoke_runner.gd"; Sentinel = "GATE_A_LIFECYCLE_OK" },
            @{ Script = "res://tests/gate_a/audio_safety_runner.gd"; Sentinel = "GATE_A_AUDIO_SAFETY_OK" },
            @{ Script = "res://tests/gate_a/submission_probe.gd"; Sentinel = "GATE_A_SUBMISSION_PROBE_OK" }
          )
          foreach ($runner in $runnerMatrix) {
            & tools/invoke_godot_windows.ps1 `
              -GodotArguments @("--headless", "--path", ".", "--script", $runner.Script) `
              -ExpectedSentinel $runner.Sentinel
          }

      - name: Run exact package inventory negative tests
        run: python -X utf8 -m unittest discover -s tests/runtime_v2 -p 'test_*.py' -v

      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/export | Out-Null
          & tools/invoke_godot_windows.ps1 `
            -GodotArguments @(
              "--headless",
              "--path", ".",
              "--export-release", "Windows Gate A RC1",
              "artifacts/export/SonicMatterGateA.exe"
            ) `
            -TimeoutSeconds 300
          if (-not (Test-Path -LiteralPath "artifacts/export/SonicMatterGateA.exe" -PathType Leaf)) {
            throw "Godot exited successfully without producing the exported executable."
          }
          if (-not (Test-Path -LiteralPath "artifacts/export/SonicMatterGateA.pck" -PathType Leaf)) {
            throw "Godot exited successfully without producing the exported PCK."
          }

      - name: Run exported release smoke
        shell: pwsh
        run: |
          $stdout = "artifacts/export/export-smoke.stdout.log"
          $stderr = "artifacts/export/export-smoke.stderr.log"
          $exeCandidate = Join-Path (Get-Location) "artifacts/export/SonicMatterGateA.exe"
          if (-not (Test-Path -LiteralPath $exeCandidate -PathType Leaf)) {
            Get-ChildItem -LiteralPath "artifacts/export" -Force
            throw "Exported executable is missing: $exeCandidate"
          }
          $exePath = (Resolve-Path -LiteralPath $exeCandidate -ErrorAction Stop).Path
          $startParameters = @{
            FilePath = $exePath
            ArgumentList = @("--headless", "--", "--gate-a-export-smoke")
            RedirectStandardOutput = $stdout
            RedirectStandardError = $stderr
            PassThru = $true
            WindowStyle = "Hidden"
          }
          $process = Start-Process @startParameters
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force
            throw "Exported release smoke timed out."
          }
          Get-Content $stdout
          Get-Content $stderr
          if ($process.ExitCode -ne 0) {
            throw "Exported release exited with $($process.ExitCode)."
          }
          if (-not (Select-String -Path $stdout -Pattern "GATE_A_EXPORT_SMOKE_OK" -Quiet)) {
            throw "Exported release did not emit GATE_A_EXPORT_SMOKE_OK."
          }
          if (-not (Select-String -Path $stdout -Pattern 'GATE_A_EXPORT_INVENTORY .*"ok":true' -Quiet)) {
            throw "Exported release did not prove exact logical PCK inventory."
          }

      - name: Audit and build deterministic RC1 packages
        run: python -X utf8 tools/package_rc0.py --kind all

      - name: Rebuild RC1 packages and compare hashes
        shell: pwsh
        run: |
          python -X utf8 tools/package_rc0.py --kind all --output-dir artifacts/packages-repeat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('sonic-matter-addon-0.1.0-rc1.zip', 'sonic-matter-demo-0.1.0-rc1.zip')) {
            $first = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts/packages/$name").Hash
            $second = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts/packages-repeat/$name").Hash
            if ($first -ne $second) { throw "Package repeatability failed: $name" }
          }

      - name: Verify clean addon install and plugin cycle
        run: >-
          python -X utf8 tools/verify_clean_install.py
          --archive artifacts/packages/sonic-matter-addon-0.1.0-rc1.zip
          --godot godot
      - name: Upload RC1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonic-matter-gate-a-rc1
          path: |
            artifacts/packages/*.zip
            artifacts/export/SonicMatterGateA.exe
            artifacts/export/SonicMatterGateA.pck
            artifacts/export/export-smoke.*.log
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Release Gate
    if: ${{ always() }}
    needs:
      - gate-a
      - material-lab
      - content-packs
      - windows-export
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every release job
        shell: bash
        env:
          GATE_A_RESULT: "${{ needs['gate-a'].result }}"
          MATERIAL_LAB_RESULT: "${{ needs['material-lab'].result }}"
          CONTENT_PACKS_RESULT: "${{ needs['content-packs'].result }}"
          WINDOWS_EXPORT_RESULT: "${{ needs['windows-export'].result }}"
        run: |
          printf '%s\n' \
            "Gate A=$GATE_A_RESULT" \
            "Material Lab=$MATERIAL_LAB_RESULT" \
            "Content packs=$CONTENT_PACKS_RESULT" \
            "Windows export=$WINDOWS_EXPORT_RESULT"
          for result in \
            "$GATE_A_RESULT" \
            "$MATERIAL_LAB_RESULT" \
            "$CONTENT_PACKS_RESULT" \
            "$WINDOWS_EXPORT_RESULT"
          do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
