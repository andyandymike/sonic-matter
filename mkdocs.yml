site_name: SonicMatter
site_description: Physics-driven, controllable Foley for games.
site_url: https://andyandymike.github.io/sonic-matter/
repo_url: https://github.com/andyandymike/sonic-matter
repo_name: andyandymike/sonic-matter
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: README.md
  - Gate A contract: gate-a-contract.md
  - Decisions:
      - Gate A bootstrap: adr/0001-gate-a-bootstrap.md
  - Maintainers:
      - GitHub governance: maintainer/github-governance.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

copyright: Copyright &copy; 2026 SonicMatter contributors
